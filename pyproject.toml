[project]
name = "localpasswordvault"
version = "4.0.0"
description = "Desktop password manager — Argon2id, AES-256-GCM, app-level 2FA"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "customtkinter>=6.0.0",
    "qrcode>=7.4",
    "PySide6>=6.6.0",
]

[project.scripts]
localpasswordvault = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
